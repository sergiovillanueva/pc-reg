[project]
name = "pc-reg"
version = "2.0.0"
description = "PC-Reg: Modeling Spatial Dependencies for Logical Anomaly Detection"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "torch",
    "torchvision",
    "transformers>=4.56",
    "scikit-learn",
    "scikit-image",
    "scipy",
    "numpy>=2.0",
    "pandas",
    "Pillow",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["pcreg"]
